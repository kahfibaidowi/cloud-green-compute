services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile.baseline
    container_name: green-app
    ports:
      - "5000:5000"
    networks:
      - green-net

  orchestrator:
    build:
      context: ./orchestrator
    container_name: green-orchestrator
    ports:
      - "8000:8000"
    environment:
      - DOCKER_NETWORK=cloud-green-computing_green-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./app:/workspace/app:ro
    networks:
      - green-net

  frontend:
    build:
      context: ./frontend
    container_name: green-frontend
    ports:
      - "3000:3000"
    depends_on:
      - orchestrator
    networks:
      - green-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: green-cadvisor
    privileged: true
    ports:
      - "8080:8080"
    command:
      - "--docker_only=true"
      - "--housekeeping_interval=5s"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - green-net

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: green-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - cadvisor
    networks:
      - green-net

networks:
  green-net:
    name: cloud-green-computing_green-net
    driver: bridge